name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the numerical core
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.4.4 scipy==1.17.1 numba==0.67.0 pytest
          pip install -e . --no-deps
      - name: Run the unit tests
        run: pytest -q
